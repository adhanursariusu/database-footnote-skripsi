<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Minta mesin pencari (dan crawler cek similarity) tidak mengindeks halaman ini -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Bukti Rujukan Skripsi</title>
<style>
  :root {
    --bg: #f6f4ef; --paper: #fffdf9; --ink: #1d1b18; --muted: #6c665c; --faint: #9a9488;
    --line: #e4dfd5; --accent: #7a2e12; --accent-soft: #f4e6dc; --ok: #2f6b3f; --ok-soft: #e3f0e4;
    --mark: #ffe88a; --mark-ink: #1d1b18; --shadow: 0 18px 50px rgba(30, 20, 10, .22);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412; --paper: #1d1c19; --ink: #ece7de; --muted: #a59e92; --faint: #7a7469;
      --line: #33302a; --accent: #e3956a; --accent-soft: #3a271d; --ok: #8fcb9c; --ok-soft: #1f3324;
      --mark: #6b5a12; --mark-ink: #fff6cc; --shadow: 0 18px 50px rgba(0, 0, 0, .6);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--serif); }
  a { color: var(--accent); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 16px 96px; }

  header .kicker { font: 600 .74rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  header h1 { font-size: clamp(1.25rem, 3.2vw, 1.7rem); line-height: 1.3; margin: 10px 0 6px; font-weight: 600; }
  header .by { color: var(--muted); font: .92rem var(--sans); margin: 0; }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; margin: 22px 0 18px; font: .86rem var(--sans); color: var(--muted); }
  .stats b { color: var(--ink); font-size: 1.15rem; font-variant-numeric: tabular-nums; margin-right: 4px; }

  .tools { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0 12px; display: flex; flex-wrap: wrap; gap: 8px; font-family: var(--sans); border-bottom: 1px solid var(--line); }
  .tools input { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font: .95rem var(--sans); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--paper); color: var(--muted); padding: 7px 11px; border-radius: 99px; font: .8rem var(--sans); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  ol.fn { list-style: none; margin: 0; padding: 0; }
  .fn li { display: grid; grid-template-columns: 3em 1fr; gap: 12px; padding: 12px 6px; border-bottom: 1px solid var(--line); scroll-margin-top: 90px; }
  .fn li.flash { animation: flash 1.6s ease; }
  @keyframes flash { 0%, 40% { background: var(--accent-soft); } 100% { background: transparent; } }
  .fn .no { text-align: right; color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .fn .cite { font-size: .97rem; overflow-wrap: anywhere; }
  .fn .open { all: unset; cursor: pointer; border-bottom: 1px dashed color-mix(in srgb, var(--accent) 55%, transparent); }
  .fn .open:hover, .fn .open:focus-visible { color: var(--accent); border-bottom-style: solid; }
  .fn .meta { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font: .72rem var(--sans); color: var(--faint); }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font: 600 .68rem var(--sans); letter-spacing: .03em; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.off { background: transparent; color: var(--faint); border: 1px solid var(--line); }
  .badge.wait { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
  .meta a { color: var(--faint); }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); font-family: var(--sans); }

  /* ---------- popup ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; background: rgba(20, 14, 8, .5); display: none; overflow-y: auto; padding: 4vh 12px; }
  .overlay.open { display: block; }
  .modal { background: var(--paper); max-width: 1240px; margin: 0 auto; border-radius: 14px; box-shadow: var(--shadow); }
  .m-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: -4vh; background: var(--paper); border-radius: 14px 14px 0 0; }
  .m-head h2 { font-size: 1.05rem; margin: 0; flex: 1; font-weight: 600; }
  .icon-btn { all: unset; cursor: pointer; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); font: 1.2rem var(--sans); }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--accent-soft); color: var(--accent); }
  .icon-btn[disabled] { opacity: .3; pointer-events: none; }
  .m-body { padding: 20px; }
  .m-cite { font-size: .95rem; padding: 12px 14px; background: var(--bg); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; overflow-wrap: anywhere; }
  .m-info { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 12px 0 4px; font: .82rem var(--sans); color: var(--muted); }
  .m-info b { color: var(--ink); font-weight: 600; }
  .sec-title { font: 600 .72rem var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 22px 0 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; margin-bottom: 18px; }
  .pair.solo { grid-template-columns: 1fr; }
  @media (max-width: 760px) { .pair { grid-template-columns: 1fr; gap: 10px; } }
  .pair .lbl { font: 600 .68rem var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin-bottom: 5px; }
  .pair .lbl.id { color: var(--accent); }
  .pair-ket { grid-column: 1 / -1; font: .78rem var(--sans); color: var(--muted); margin-top: -4px; }
  details.txt { margin-top: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  details.txt summary { cursor: pointer; font: .82rem var(--sans); color: var(--muted); }
  details.txt[open] summary { margin-bottom: 10px; }
  details.txt .tbox { border: 0; padding: 0; }
  figure { margin: 0 0 14px; }
  .pair figure { margin: 0; }
  figure img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: zoom-in; }
  figcaption { font: .78rem var(--sans); color: var(--muted); margin-top: 6px; }
  .texts { display: grid; gap: 14px; }
  .texts.two { grid-template-columns: 1fr 1fr; }
  @media (max-width: 760px) { .texts.two { grid-template-columns: 1fr; } }
  .tbox { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tbox h3 { margin: 0 0 6px; font: 600 .74rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .tbox p { margin: 0 0 .7em; font-size: .97rem; }
  .tbox p:last-child { margin-bottom: 0; }
  mark { background: var(--mark); color: var(--mark-ink); padding: 0 2px; border-radius: 2px; }
  .note { margin-top: 14px; font: .85rem var(--sans); color: var(--muted); background: var(--bg); padding: 10px 12px; border-radius: 8px; }
  .pending { padding: 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font: .9rem var(--sans); text-align: center; }
  .m-foot { display: flex; justify-content: space-between; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--line); font: .85rem var(--sans); }
  .m-foot button { all: unset; cursor: pointer; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink); }
  .m-foot button:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
  .m-foot button[disabled] { opacity: .35; cursor: default; }
  .lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .88); display: none; overflow: auto; padding: 16px; cursor: zoom-out; }
  .lightbox.open { display: block; }
  .lightbox img { display: block; max-width: none; width: min(1400px, 200%); margin: 0 auto; background: #fff; }
  @media (max-width: 600px) { .lightbox img { width: 220%; } }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--paper); font: .85rem var(--sans); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; z-index: 30; pointer-events: none; }
  .toast.show { opacity: 1; }
  footer { margin-top: 34px; font: .8rem var(--sans); color: var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Bukti rujukan catatan kaki</div>
    <h1 id="judul">Bukti Rujukan Skripsi</h1>
    <p class="by" id="penulis"></p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="tools">
    <input id="q" type="search" placeholder="Cari nomor, penulis, judul, atau isi kutipan…" aria-label="Cari">
    <div class="chips" role="group" aria-label="Saring">
      <button class="chip" data-f="semua" aria-pressed="true">Semua</button>
      <button class="chip" data-f="ada">Ada bukti</button>
      <button class="chip" data-f="belum">Belum diisi</button>
      <button class="chip" data-f="tanpa">Pasal &amp; buku fisik</button>
    </div>
  </div>

  <ol class="fn" id="list"></ol>
  <div class="empty" id="empty" hidden>Tidak ada catatan kaki yang cocok.</div>

  <footer>Klik nomor catatan kaki yang bergaris putus-putus untuk melihat bukti kutipan. Tautan langsung ke satu catatan kaki: tambahkan <code>#fn-NOMOR</code> di akhir alamat halaman.</footer>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="m-head">
      <h2 id="m-title"></h2>
      <button class="icon-btn" id="m-copy" title="Salin tautan catatan kaki ini" aria-label="Salin tautan"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg></button>
      <button class="icon-btn" id="m-close" title="Tutup (Esc)" aria-label="Tutup">✕</button>
    </div>
    <div class="m-body" id="m-body"></div>
    <div class="m-foot">
      <button id="m-prev">← Sebelumnya</button>
      <button id="m-next">Berikutnya →</button>
    </div>
  </div>
</div>
<div class="lightbox" id="lightbox"><img alt=""></div>
<div class="toast" id="toast"></div>

<!-- Data: daftar footnote (otomatis dari naskah) dan bukti kutipan (diisi bertahap) -->
<script src="footnotes.js"></script>
<script src="bukti.js"></script>
<script>
(() => {
  // ---------- pengaturan tampilan ----------
  const JUDUL = "Perlindungan Hukum Konsumen Pemilik Aset Kripto dalam Kasus Kepailitan FTX di Amerika Serikat: Implikasi bagi Pembaruan Hukum Kepailitan di Indonesia";
  const PENULIS = "Adha Nursari Marang · Fakultas Hukum Universitas Sumatera Utara";

  const LABEL = { dokumen: "Dokumen", jurnal: "Jurnal", skripsi: "Skripsi", laporan: "Laporan", web: "Laman web", ebook: "E-book", file: "File", pasal: "Pasal", buku: "Buku fisik" };
  const TANPA_POPUP = new Set(["pasal", "buku"]);

  // Sumber berbayar: klik footnote langsung membuka artikelnya (tanpa popup)
  const LANGSUNG_DOMAIN = /\b(bloomberg\.com|bloomberglaw\.com)\b/i;

  const FN = (window.FOOTNOTES || []).map(f => {
    const root = (window.FOOTNOTES || []).find(x => x.no === f.sumber) || f;
    const b = (window.BUKTI || {})[f.no] || (window.BUKTI || {})[root.no]?.langsung && { langsung: window.BUKTI[root.no].langsung } || null;
    const jenis = (b && b.jenis) || f.jenis;
    const url = f.url || root.url;
    const langsung = (b && b.langsung) || (LANGSUNG_DOMAIN.test(url) ? url : "");
    const isi = !!(b && (b.kutipan || b.terjemahan || (b.gambar && b.gambar.length)));
    return { ...f, jenis, bukti: b, root, langsung, popup: !TANPA_POPUP.has(jenis) && !langsung, isi };
  });
  const byNo = new Map(FN.map(f => [f.no, f]));
  const popupList = FN.filter(f => f.popup);

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rich = s => esc(s).split(/\n{2,}/).map(p => "<p>" + p.replace(/\*\*(.+?)\*\*/gs, "<mark>$1</mark>").replace(/\n/g, "<br>") + "</p>").join("");
  const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

  $("#judul").textContent = JUDUL;
  $("#penulis").textContent = PENULIS;
  document.title = "Bukti Rujukan — " + JUDUL.split(":")[0];

  const nUnik = FN.filter(f => f.sumber === f.no).length;
  const nIsi = FN.filter(f => f.popup && f.isi).length;
  const nLink = FN.filter(f => f.langsung).length;
  $("#stats").innerHTML =
    `<span><b>${FN.length}</b>catatan kaki</span><span><b>${nUnik}</b>sumber berbeda</span>` +
    `<span><b>${nIsi}</b>/ ${popupList.length} bukti terisi</span><span><b>${nLink}</b>tautan langsung</span>`;

  // ---------- daftar ----------
  let filter = "semua";
  function render() {
    const q = $("#q").value.trim().toLowerCase();
    const rows = FN.filter(f => {
      if (filter === "ada" && !((f.popup && f.isi) || f.langsung)) return false;
      if (filter === "belum" && !(f.popup && !f.isi)) return false;
      if (filter === "tanpa" && (f.popup || f.langsung)) return false;
      if (!q) return true;
      if (/^\d+$/.test(q)) return String(f.no) === q;
      const hay = [f.sitasi, f.root.sitasi, f.bukti?.kutipan, f.bukti?.terjemahan].join(" ").toLowerCase();
      return hay.includes(q);
    });
    $("#list").innerHTML = rows.map(f => {
      const cite = f.langsung
        ? `<a class="open" href="${esc(f.langsung)}" target="_blank" rel="noopener">${esc(f.sitasi)} ↗</a>`
        : f.popup ? `<button class="open" data-no="${f.no}">${esc(f.sitasi)}</button>`
        : esc(f.sitasi);
      const status = f.langsung ? `<span class="badge ok">↗ buka link</span>`
        : !f.popup ? `<span class="badge off">tanpa popup</span>`
        : f.isi ? `<span class="badge ok">● bukti</span>` : `<span class="badge wait">belum diisi</span>`;
      const ref = f.sumber !== f.no ? `<span>↳ sumber: <a href="#fn-${f.sumber}" data-jump="${f.sumber}">fn ${f.sumber}</a></span>` : "";
      return `<li id="fn-${f.no}"><span class="no">${f.no}</span><div><div class="cite">${cite}</div>
        <div class="meta"><span class="badge">${esc(LABEL[f.jenis] || f.jenis)}</span>${status}${ref}</div></div></li>`;
    }).join("");
    $("#empty").hidden = rows.length > 0;
  }

  // ---------- popup ----------
  let current = null;
  function openFn(no, push = true) {
    const f = byNo.get(no);
    if (!f || !f.popup) return;
    current = f;
    const b = f.bukti || {};
    $("#m-title").textContent = `Catatan kaki ${f.no}`;
    let h = `<div class="m-cite">${esc(f.sitasi)}</div>`;
    if (f.sumber !== f.no) h += `<div class="m-cite" style="margin-top:8px;border-left-color:var(--line)"><span style="font:.75rem var(--sans);color:var(--faint)">Sumber lengkap (fn ${f.root.no}):</span><br>${esc(f.root.sitasi)}</div>`;
    const url = f.url || f.root.url;
    h += `<div class="m-info"><span><span class="badge">${esc(LABEL[f.jenis] || f.jenis)}</span></span>`;
    if (b.halaman) h += `<span>Letak kutipan: <b>${esc(b.halaman)}</b></span>`;
    if (url) h += `<span><a href="${esc(url)}" target="_blank" rel="noopener">Buka sumber asli ↗</a></span>`;
    h += `</div>`;

    if (!f.isi) {
      h += `<div class="sec-title">Bukti</div><div class="pending">Bukti kutipan untuk catatan kaki ini belum ditambahkan.</div>`;
    } else {
      const gb = b.gambar || [];
      if (gb.length) {
        const adaTerj = gb.some(g => g.src_id);
        h += `<div class="sec-title">${adaTerj ? "Sumber asli &amp; terjemahan" : "Tangkapan layar sumber"}</div>`;
        h += gb.map(g => {
          const asli = `<figure>${adaTerj ? `<div class="lbl">Asli · English</div>` : ""}<img src="${esc(g.src)}" alt="${esc(g.ket || "Tangkapan layar sumber")}" loading="lazy"></figure>`;
          const terj = g.src_id ? `<figure><div class="lbl id">Terjemahan · Indonesia</div><img src="${esc(g.src_id)}" alt="Terjemahan: ${esc(g.ket || "")}" loading="lazy"></figure>` : "";
          return `<div class="pair ${terj ? "" : "solo"}">${asli}${terj}<div class="pair-ket">${esc(g.ket || "")}</div></div>`;
        }).join("");
      }
      if (b.kutipan || b.terjemahan) {
        const t = `<div class="texts ${b.kutipan && b.terjemahan ? "two" : ""}">` +
          (b.kutipan ? `<div class="tbox"><h3>${b.terjemahan ? "Teks asli" : "Kutipan"}</h3>${rich(b.kutipan)}</div>` : "") +
          (b.terjemahan ? `<div class="tbox"><h3>Terjemahan Indonesia</h3>${rich(b.terjemahan)}</div>` : "") + `</div>`;
        h += gb.length ? `<details class="txt"><summary>Tampilkan teks (bisa disalin)</summary>${t}</details>`
                       : `<div class="sec-title">Teks sumber</div>${t}`;
      }
    }
    if (b.catatan) h += `<div class="note">${linkify(b.catatan)}</div>`;
    $("#m-body").innerHTML = h;

    const i = popupList.indexOf(f);
    $("#m-prev").disabled = i <= 0;
    $("#m-next").disabled = i >= popupList.length - 1;
    $("#m-prev").textContent = i > 0 ? `← fn ${popupList[i - 1].no}` : "← Sebelumnya";
    $("#m-next").textContent = i < popupList.length - 1 ? `fn ${popupList[i + 1].no} →` : "Berikutnya →";

    $("#overlay").classList.add("open");
    $("#overlay").setAttribute("aria-hidden", "false");
    $("#overlay").scrollTop = 0;
    document.body.style.overflow = "hidden";
    if (push) history.replaceState(null, "", `#fn-${f.no}`);
    $("#m-close").focus({ preventScroll: true });
  }
  function closeFn() {
    $("#overlay").classList.remove("open");
    $("#overlay").setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if (current) {
      const li = document.getElementById(`fn-${current.no}`);
      history.replaceState(null, "", location.pathname + location.search);
      if (li) { li.scrollIntoView({ block: "center" }); li.querySelector("button.open")?.focus({ preventScroll: true }); }
    }
    current = null;
  }
  function step(d) {
    if (!current) return;
    const i = popupList.indexOf(current) + d;
    if (i >= 0 && i < popupList.length) openFn(popupList[i].no);
  }
  function jump(no) {
    $("#q").value = ""; setFilter("semua");
    const li = document.getElementById(`fn-${no}`);
    if (li) { li.scrollIntoView({ block: "center", behavior: "smooth" }); li.classList.remove("flash"); void li.offsetWidth; li.classList.add("flash"); }
  }
  function setFilter(f) {
    filter = f;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.f === f)));
    render();
  }
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }

  // ---------- event ----------
  $("#list").addEventListener("click", e => {
    const b = e.target.closest("button.open"); if (b) return openFn(+b.dataset.no);
    const j = e.target.closest("[data-jump]"); if (j) { e.preventDefault(); jump(+j.dataset.jump); }
  });
  $("#q").addEventListener("input", render);
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => setFilter(c.dataset.f)));
  $("#m-close").addEventListener("click", closeFn);
  $("#m-prev").addEventListener("click", () => step(-1));
  $("#m-next").addEventListener("click", () => step(1));
  $("#m-copy").addEventListener("click", async () => {
    const url = location.href.split("#")[0] + `#fn-${current.no}`;
    try { await navigator.clipboard.writeText(url); toast("Tautan disalin"); } catch { prompt("Salin tautan ini:", url); }
  });
  $("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeFn(); });
  $("#m-body").addEventListener("click", e => {
    const img = e.target.closest("figure img"); if (!img) return;
    $("#lightbox img").src = img.src; $("#lightbox").classList.add("open");
  });
  $("#lightbox").addEventListener("click", () => $("#lightbox").classList.remove("open"));
  document.addEventListener("keydown", e => {
    if ($("#lightbox").classList.contains("open")) { if (e.key === "Escape") $("#lightbox").classList.remove("open"); return; }
    if (!current) return;
    if (e.key === "Escape") closeFn();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
  });
  function fromHash() {
    const m = location.hash.match(/^#fn-(\d+)$/);
    if (!m) return;
    const f = byNo.get(+m[1]);
    if (f && f.popup) openFn(f.no, false); else if (f) jump(f.no);
  }
  window.addEventListener("hashchange", fromHash);

  render();
  fromHash();
})();
</script>
</body>
